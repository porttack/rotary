<style>
  #bulletin {
    max-width: 760px;
    margin: 0 auto;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 11pt;
    color: #222;
    line-height: 1.55;
  }
  .masthead {
    text-align: center;
    margin-bottom: 1.5em;
    padding-bottom: 1em;
    border-bottom: 3px solid #17458F;
  }
  .masthead h1 { font-size: 2.2em; color: #17458F; margin: 0 0 0.15em; letter-spacing: 0.02em; }
  .masthead-sub { color: #666; font-style: italic; font-size: 0.95em; margin: 0; }

  .bulletin-section { margin-top: 1.8em; }
  .bulletin-section > h2 {
    color: #17458F;
    font-size: 1.35em;
    border-bottom: 2px solid #17458F;
    padding-bottom: 0.2em;
    margin-bottom: 0.8em;
  }

  .important-section {
    background: #eef3fb; border: 1px solid #17458F;
    border-radius: 8px; padding: 0.6em 1.1em 1em;
  }
  .important-section > h2 { color: #17458F; border-bottom-color: #17458F; }

  .event-block { margin-bottom: 1.2em; }
  .event-heading { color: #1a56db; font-size: 1.05em; margin: 0.8em 0 0.15em; }
  .event-heading.past { color: #555; }
  .event-meta { color: #555; font-style: italic; font-size: 0.9em; margin: 0 0 0.5em; }
  .event-photo {
    display: block; max-width: 300px; height: auto;
    margin: 0.6em 0; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .event-opening { font-size: 0.95em; margin: 0.3em 0; }
  .event-organizer { font-size: 0.92em; color: #555; margin: 0.2em 0; }
  .event-type-tag {
    display: inline-block; font-size: 0.72em; font-weight: bold;
    text-transform: uppercase; letter-spacing: 0.04em;
    background: #e8eaf0; color: #374151; border-radius: 10px;
    padding: 1px 8px; vertical-align: middle;
  }
  .event-narrative { margin: 0.5em 0; }
  .meet-link { font-size: 0.9em; margin: 0.4em 0; }

  .duty-roster { margin-top: 0.8em; }
  .duty-roster h4 {
    font-size: 0.88em; color: #333; margin: 0 0 0.3em;
    font-family: Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .duty-table { border-collapse: collapse; font-size: 0.88em; font-family: Arial, sans-serif; }
  .duty-table td { padding: 0.1em 1.2em 0.1em 0; vertical-align: top; }
  .duty-table td:first-child { font-weight: bold; color: #17458F; white-space: nowrap; }
  .tbd-roles { color: #bbb; font-size: 0.82em; margin: 0.2em 0 0; font-family: Arial, sans-serif; }

  .section-rule { border: none; border-top: 1px solid #e0e0e0; margin: 1.2em 0; }

  .skim-note { color: #888; font-style: italic; font-size: 0.85em; margin-bottom: 0.6em; }
  .month-group h3 {
    color: #17458F; font-size: 1em; margin: 1em 0 0.25em;
    font-family: Arial, sans-serif; font-weight: bold;
  }
  .skim-list { list-style: none; padding: 0; margin: 0 0 0.5em; }
  .skim-item {
    font-size: 0.88em; padding: 0.22em 0;
    border-bottom: 1px solid #f0f0f0;
    font-family: Arial, sans-serif;
  }
  .skim-item.cancelled { color: #bbb; }
  .skim-venue { font-size: 0.85em; color: #666; }
  .skim-venue a { color: #1a56db; text-decoration: none; }

  .calendar-legend {
    color: #666; font-size: 0.82em; font-style: italic;
    margin-bottom: 0.5em; font-family: Arial, sans-serif;
  }
  .month-calendar { margin: 0.8em 0; overflow-x: auto; }
  .month-calendar > h3 {
    color: #17458F; font-size: 0.95em; font-weight: bold;
    margin: 1em 0 0.2em; font-family: Arial, sans-serif;
  }
  .cal-table {
    border-collapse: collapse; width: 100%;
    font-size: 0.78em; font-family: Arial, sans-serif;
  }
  .cal-table th {
    background: #1a3a6b; color: #fff; font-weight: bold;
    padding: 3px 5px; text-align: center; border: 1px solid #fff;
  }
  .cal-table td {
    border: 1px solid #ddd; padding: 3px 4px;
    vertical-align: top; min-width: 36px;
  }
  .cal-table td.empty { background: #f5f5f5; }
  .cal-date { font-weight: bold; display: block; margin-bottom: 1px; }
  .cal-event { font-size: 0.82em; display: block; line-height: 1.3; }
  .cal-event.cancelled { color: #aaa; }

  .bg-meeting      { background: #c7d7fb; }
  .bg-assembly     { background: #a5f3fc; }
  .bg-board        { background: #93c5fd; }
  .bg-social       { background: #fde68a; }
  .bg-service      { background: #fdba74; }
  .bg-greybears    { background: #fde8d0; }
  .bg-fundraiser   { background: #e9d5ff; }
  .bg-district     { background: #86efac; }
  .bg-committee    { background: #fce7f3; }
  .bg-holiday      { background: #fca5a5; }
  .bg-other        { background: #d1d5db; }
  .bg-cancelled    { background: #e5e7eb; }

  .bulletin-footer {
    margin-top: 2em; padding-top: 0.5em; border-top: 1px solid #ddd;
    color: #bbb; font-size: 0.75em; text-align: center;
    font-style: italic; font-family: Arial, sans-serif;
  }
  a { color: #1a56db; }
  .event-narrative a, .meet-link a, .event-opening a { text-decoration: underline; }

  @media (max-width: 600px) {
    #bulletin { font-size: 10pt; }
    .event-photo { max-width: 100%; }
    .cal-table { font-size: 0.68em; }
    .cal-table td { min-width: 28px; padding: 2px; }
  }

  /* Section chooser (viewer preference; not part of the printed bulletin) */
  #section-controls {
    max-width: 760px; margin: 0 auto 0.4em; text-align: right;
    font-family: Arial, sans-serif;
  }
  .sec-menu { display: inline-block; position: relative; }
  .sec-menu > summary {
    list-style: none; cursor: pointer; display: inline-block;
    font-size: 0.8em; color: #17458F; border: 1px solid #c5cae9;
    background: #f5f7fc; border-radius: 6px; padding: 5px 11px;
  }
  .sec-menu > summary::-webkit-details-marker { display: none; }
  .sec-menu[open] > summary { background: #e8eef9; }
  #sec-menu-list {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
    background: #fff; border: 1px solid #c5cae9; border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15); padding: 0.3em 0;
    min-width: 200px; text-align: left;
  }
  #sec-menu-list label {
    display: flex; align-items: center; gap: 0.55em;
    padding: 6px 14px; font-size: 0.85em; color: #333;
    cursor: pointer; white-space: nowrap;
  }
  #sec-menu-list label:hover { background: #f0f4ff; }
  @media print { #section-controls { display: none !important; } }
</style>

<div id="section-controls" style="display:none;">
  <details class="sec-menu">
    <summary>Sections &#9662;</summary>
    <div id="sec-menu-list"></div>
  </details>
</div>
<div id="bulletin-loading" style="text-align:center;padding:2em;color:#666;">
  Loading this week&rsquo;s bulletin&hellip;
</div>
<article id="bulletin" style="display:none;"></article>

<script src="{{ '/assets/js/rotary-common.js' | relative_url }}"></script>
<script>
const MEETING_WEEKS_AHEAD = 3;   // "Meetings Coming Up" window (next 3 weeks)
const WEEKS_AHEAD  = 12;   // "Looking Ahead" dates list window
const EVENT_WEEKS_AHEAD = 26;  // "Club Events & Socials" window (~6 months out)

const ROLE_FIELDS = [
  { key:'mc',            label:'MC'             },
  { key:'setupTeardown', label:'Setup/Teardown' },
  { key:'avZoom',        label:'AV/Zoom'        },
  { key:'greeter',       label:'Greeter'        },
  { key:'fourWayTest',   label:'4-Way-Test'     },
  { key:'thought',       label:'Thought'        },
  { key:'detective',     label:'Detective'      },
  { key:'bagPerson',     label:'Bag Person'     },
];

const TYPE_BG = {
  'meeting':'bg-meeting',         'assembly':'bg-assembly',
  'board meeting':'bg-board',     'social':'bg-social',
  'service':'bg-service',         'grey bears':'bg-greybears',
  'fundraiser':'bg-fundraiser',   'district event':'bg-district',
  'committee':'bg-committee',     'holiday':'bg-holiday',
  'other':'bg-other',
};
const TYPE_ABBREV = {
  'meeting':'Mtg',          'assembly':'Assembly',  'board meeting':'Brd Mtg',
  'social':'Social',        'service':'Service',    'grey bears':'Grey Bears',
  'fundraiser':'Fundraiser','district event':'District', 'committee':'Com',
  'holiday':'Holiday',      'other':'Oth',
};
// Speaker meetings get the detailed "Coming Up" treatment with duty rosters.
const DETAIL_TYPES = ['meeting', 'board meeting', 'assembly'];
// Non-meeting club happenings featured in "Club Events & Socials" (no holidays,
// no weekly Grey Bears — those stay in Looking Ahead / the calendar grid).
const HAPPENING_TYPES = ['social', 'service', 'fundraiser', 'committee', 'district event', 'other'];

// Pick a call-to-action label based on where the link points.
function linkLabel(url) {
  const u = String(url || '').toLowerCase();
  if (/eventbrite|tickets?|ticketing|brownpaper/.test(u))        return 'Buy Tickets';
  if (/rsvp/.test(u))                                            return 'RSVP';
  if (/signupgenius|sign[-_]?up|volunteer/.test(u))             return 'Sign Up';
  if (/forms\.gle|docs\.google\.com\/forms|google\.com\/forms|forms\.office/.test(u)) return 'Sign Up';
  if (/donate|givebutter|gofundme|fundraise/.test(u))           return 'Donate';
  return 'More Info';
}

// ── Section: Masthead ─────────────────────────────────────────────────────
function masthead(today) {
  const ds = fmt(today, {month:'long', day:'numeric', year:'numeric'});
  return `<header class="masthead">
  <h1>SLV Rotary</h1>
  <p class="masthead-sub">Weekly Newsletter &nbsp;&middot;&nbsp; ${esc(ds)}</p>
</header>`;
}

// ── Section: Important ────────────────────────────────────────────────────
// Featured at the very top. Each flagged-important item renders as its full
// post — the same block (photo + narrative) it gets in its normal section —
// using the meeting / club-event / message renderer that fits its type.
function importantSection(rows) {
  const blocks = rows.map(row =>
    isMessageType(row)                                ? messageBlock(row)
    : DETAIL_TYPES.includes(fv(row, COL.eventType).toLowerCase()) ? comingUpBlock(row)
    : clubEventBlock(row)
  ).join('\n<hr class="section-rule">\n');

  return `<section class="bulletin-section important-section">
<h2>Important</h2>
${blocks}
</section>`;
}

// A Message announcement: headline + narrative body + optional link. Shared by
// the Important section (important messages) and the Announcements section.
function messageBlock(row) {
  const headline = fv(row, COL.mainTopic) || 'Announcement';
  const summary  = fv(row, COL.summary);
  const url      = fv(row, COL.speakerUrl);
  let html = `<div class="event-block">
  <h3 class="event-heading">${esc(headline)}</h3>`;
  if (summary) html += `\n  <p class="event-narrative">${textToHtml(summary)}</p>`;
  if (url) html += `\n  <p class="meet-link"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(linkLabel(url))} &rarr;</a></p>`;
  html += `</div>`;
  return html;
}

// ── Section: Announcements ────────────────────────────────────────────────
// Non-important Message rows still within their "show until" date.
function announcements(rows) {
  const blocks = rows.map(messageBlock).join('\n<hr class="section-rule">\n');
  return `<hr class="section-rule">
<section class="bulletin-section">
<h2>Announcements</h2>
${blocks}
</section>`;
}

// ── Section: Coming Up ────────────────────────────────────────────────────
// One full meeting post: heading, meta, photos, narrative, duty roster.
function comingUpBlock(row) {
  const d        = parseRowDate(row);
  const type     = fv(row, COL.eventType) || 'Meeting';
  const location = fv(row, COL.location);
  const speaker  = fv(row, COL.mainSpeaker);
  const topic    = fv(row, COL.mainTopic);
  const opening    = fv(row, COL.openingSpeaker);
  const summary     = fv(row, COL.summary);
  const speakerUrl  = fv(row, COL.speakerUrl);
  const photoTop    = photoSrc(row, COL.photoTop,    COL.photoTopUrl);
  const photoBottom = photoSrc(row, COL.photoBottom, COL.photoBottomUrl);
  const meetLink    = fv(row, COL.meetLink);
  const timeStr    = fv(row, COL.time);
  const cancelled  = isCancelled(row);

  // Only regular meetings have a speaker — assemblies and board meetings
  // never show "speaker TBD", but do surface a topic if one was entered.
  const hasSpeakerSlot = type.toLowerCase() === 'meeting';
  let heading = `${esc(fmtShort(d))}: ${esc(type)}`;
  if (cancelled)              heading += ` &mdash; <span style="color:#b91c1c">&#x274C; CANCELLED</span>`;
  else if (speaker && topic)  heading += ` &mdash; ${linkWrap(speaker, speakerUrl)}: ${esc(topic)}`;
  else if (speaker)           heading += ` &mdash; ${linkWrap(speaker, speakerUrl)}`;
  else if (topic)             heading += ` &mdash; ${linkWrap(topic, speakerUrl)}`;
  else if (hasSpeakerSlot)    heading += ` &mdash; <span style="color:#888">speaker TBD</span>`;

  let metaParts = [`${esc(fmtLong(d))}${timeStr ? ' at ' + esc(timeStr) : ''}`];
  if (location) metaParts.push(mapLink(location));
  const meta = metaParts.join(' &nbsp;&middot;&nbsp; ');

  let html = `<div class="event-block">
  <h3 class="event-heading${cancelled ? ' past' : ''}">${heading}</h3>
  <p class="event-meta">${meta}</p>`;

  // Cancelled meetings show date/heading only — no photos, summary, or duties.
  if (!cancelled) {
    if (photoTop && photoTop.startsWith('http')) {
      html += `\n  <img src="${esc(photoTop)}" alt="${esc(speaker || topic || type)}" class="event-photo" loading="lazy" onerror="this.style.display='none'">`;
    }
    if (opening) {
      html += `\n  <p class="event-opening"><strong>Opening:</strong> ${esc(opening)}</p>`;
    }
    if (summary) {
      html += `\n  <p class="event-narrative">${textToHtml(summary)}</p>`;
    }
    if (photoBottom && photoBottom.startsWith('http')) {
      html += `\n  <img src="${esc(photoBottom)}" alt="${esc(speaker || topic || type)}" class="event-photo" loading="lazy" onerror="this.style.display='none'">`;
    }
    if (meetLink) {
      html += `\n  <p class="meet-link"><a href="${esc(meetLink)}" target="_blank" rel="noopener">Join via Google Meet</a></p>`;
    }
    if (speakerUrl && !speaker && !topic) {
      html += `\n  <p class="meet-link"><a href="${esc(speakerUrl)}" target="_blank" rel="noopener">${esc(linkLabel(speakerUrl))} &rarr;</a></p>`;
    }

    // Board meetings don't run a duty roster (no greeter, AV, etc.).
    if (type.toLowerCase() !== 'board meeting') {
      const filled = ROLE_FIELDS.filter(rf => fv(row, COL[rf.key]));
      const tbd    = ROLE_FIELDS.filter(rf => !fv(row, COL[rf.key]));
      html += `\n  <div class="duty-roster"><h4>Meeting Duties</h4>`;
      if (filled.length) {
        html += `<table class="duty-table">` +
          filled.map(rf => `<tr><td>${esc(rf.label)}</td><td>${esc(fv(row, COL[rf.key]))}</td></tr>`).join('') +
          `</table>`;
      }
      if (tbd.length) {
        html += `<p class="tbd-roles">${tbd.map(rf => esc(rf.label)).join(', ')}: TBD</p>`;
      }
      html += `</div>`;
    }
  }
  html += `</div>`;
  return html;
}

function comingUp(rows) {
  const blocks = rows.map(comingUpBlock).join('\n<hr class="section-rule">\n');
  return `<section class="bulletin-section">
<h2>Meetings Coming Up</h2>
${blocks}
</section>`;
}

// ── Section: Club Events & Socials ────────────────────────────────────────
// Detail cards for non-meeting events (socials, service, fundraisers, district
// events, committees, other). Uses the Event Editor field mapping:
// name = Main Topic, organizer = Speaker(s) Organizer, link = Speaker URL,
// photo = Top Photo, details = Summary.
// One full non-meeting post: heading, type tag, meta, organizer, photo, narrative.
function clubEventBlock(row) {
  const d         = parseRowDate(row);
  const type      = fv(row, COL.eventType) || 'Event';
  const name      = fv(row, COL.mainTopic);
  const location  = fv(row, COL.location);
  const organizer = fv(row, COL.speakerOrganizer);
  const url       = fv(row, COL.speakerUrl);
  const summary   = fv(row, COL.summary);
  const photoTop  = photoSrc(row, COL.photoTop, COL.photoTopUrl);
  const timeStr   = fv(row, COL.time);

  const title   = name || type;
  const heading = `${esc(fmtShort(d))}: ${linkWrap(title, url)}`;

  const metaParts = [
    `<span class="event-type-tag">${esc(type)}</span>`,
    `${esc(fmtLong(d))}${timeStr ? ' at ' + esc(timeStr) : ''}`,
  ];
  if (location) metaParts.push(mapLink(location));
  const meta = metaParts.join(' &nbsp;&middot;&nbsp; ');

  let html = `<div class="event-block">
  <h3 class="event-heading">${heading}</h3>
  <p class="event-meta">${meta}</p>`;
  if (organizer) {
    html += `\n  <p class="event-organizer"><strong>Organizer:</strong> ${esc(organizer)}</p>`;
  }
  if (photoTop && photoTop.startsWith('http')) {
    html += `\n  <img src="${esc(photoTop)}" alt="${esc(title)}" class="event-photo" loading="lazy" onerror="this.style.display='none'">`;
  }
  if (summary) {
    html += `\n  <p class="event-narrative">${textToHtml(summary)}</p>`;
  }
  if (url) {
    html += `\n  <p class="meet-link"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(linkLabel(url))} &rarr;</a></p>`;
  }
  html += `</div>`;
  return html;
}

function clubEvents(rows) {
  const blocks = rows.map(clubEventBlock).join('\n<hr class="section-rule">\n');
  return `<hr class="section-rule">
<section class="bulletin-section">
<h2>Club Events &amp; Socials</h2>
${blocks}
</section>`;
}

// ── Section: Looking Ahead ────────────────────────────────────────────────
function lookingAhead(rows) {
  let inner = '', curMonth = '', openList = false;

  rows.forEach(row => {
    const d         = parseRowDate(row);
    const type      = fv(row, COL.eventType) || 'Meeting';
    const typeLow   = type.toLowerCase();
    const speaker    = fv(row, COL.mainSpeaker);
    const topic      = fv(row, COL.mainTopic);
    const location   = fv(row, COL.location);
    const cancelled  = isCancelled(row);
    const isMeeting  = DETAIL_TYPES.includes(typeLow);
    const tAbb       = abbrevTime(fv(row, COL.time));
    const speakerUrl = fv(row, COL.speakerUrl);

    const mo = fmtMonthYear(d);
    if (mo !== curMonth) {
      if (openList) inner += '</ul></div>\n';
      curMonth = mo;
      openList = true;
      inner += `<div class="month-group"><h3>${esc(mo)}</h3><ul class="skim-list">`;
    }

    let line = `${esc(fmtDayDate(d))}${tAbb ? ' ' + esc(tAbb) : ''} &nbsp; ${esc(type)}`;

    if (!cancelled) {
      if (isMeeting) {
        if (speaker && topic)  line += ` &nbsp;&middot;&nbsp; ${linkWrap(speaker, speakerUrl)}: ${esc(topic)}`;
        else if (speaker)      line += ` &nbsp;&middot;&nbsp; ${linkWrap(speaker, speakerUrl)}`;
        else if (topic)        line += ` &nbsp;&middot;&nbsp; ${linkWrap(topic, speakerUrl)}`;
        else                   line += ` &nbsp;&middot;&nbsp; TBD`;
      } else {
        if (speaker && topic)  line += ` &nbsp;&middot;&nbsp; ${linkWrap(speaker, speakerUrl)}: ${esc(topic)}`;
        else if (speaker)      line += ` &nbsp;&middot;&nbsp; ${linkWrap(speaker, speakerUrl)}`;
        else if (topic)        line += ` &nbsp;&middot;&nbsp; ${linkWrap(topic, speakerUrl)}`;
      }
    }
    if (cancelled) line += ' &nbsp; &#x274C; CANCELLED';

    const venue = (location && !cancelled)
      ? ` <span class="skim-venue">&nbsp;&#x1F4CD; ${mapLink(location, location.split(',')[0].trim())}</span>`
      : '';

    inner += `<li class="skim-item${cancelled ? ' cancelled' : ''}">${line}${venue}</li>`;
  });

  if (openList) inner += '</ul></div>';

  return `<section class="bulletin-section">
<h2>Looking Ahead</h2>
<p class="skim-note">Speakers are subject to change &mdash; more to be announced soon!</p>
${inner}
</section>`;
}

// ── Section: Recent Meetings ──────────────────────────────────────────────
function recentMeetings(rows) {
  const blocks = rows.map(renderMeetingEntry).join('\n');
  return `<hr class="section-rule">
<section class="bulletin-section">
<h2>Recent Meetings</h2>
${blocks}
</section>`;
}

// ── Section: Calendar Grid (4 months) ────────────────────────────────────
function calendarGrid(allRows, today) {
  // Build event map keyed by 'YYYY-MM-DD'
  const evMap = {};
  allRows.forEach(row => {
    const ds = normDateStr(fv(row, COL.date));
    if (!ds) return;
    if (isCancelled(row)) return;
    if (isMessageType(row)) return;   // dateless announcement, not a grid event
    if (!evMap[ds]) evMap[ds] = [];
    evMap[ds].push({
      type: fv(row, COL.eventType).toLowerCase() || 'meeting',
      time: abbrevTime(fv(row, COL.time)),
    });
  });

  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = `<hr class="section-rule">
<section class="bulletin-section">
<h2>Calendar</h2>
<p class="calendar-legend">Mtg = Meeting &nbsp;&middot;&nbsp; Brd Mtg = Board Meeting &nbsp;&middot;&nbsp; Com = Committee &nbsp;&middot;&nbsp; District = District Event</p>`;

  for (let mo = 0; mo < 4; mo++) {
    const ms       = new Date(today.getFullYear(), today.getMonth() + mo, 1);
    const daysInMo = new Date(ms.getFullYear(), ms.getMonth() + 1, 0).getDate();
    const yr       = ms.getFullYear();
    const moNum    = ms.getMonth() + 1;

    html += `<div class="month-calendar"><h3>${esc(fmtMonthYear(ms))}</h3>
<table class="cal-table">
<thead><tr>${DOW.map(d => `<th>${d}</th>`).join('')}</tr></thead>
<tbody>`;

    let dayNum = 1 - ms.getDay();
    while (dayNum <= daysInMo) {
      html += '<tr>';
      for (let dow = 0; dow < 7; dow++, dayNum++) {
        if (dayNum < 1 || dayNum > daysInMo) {
          html += '<td class="empty"></td>';
        } else {
          const key  = `${yr}-${String(moNum).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
          const evs  = evMap[key] || [];
          const bgCls = evs.length === 0 ? '' : (TYPE_BG[evs[0].type] || 'bg-other');

          html += `<td${bgCls ? ` class="${bgCls}"` : ''}><span class="cal-date">${dayNum}</span>`;
          evs.forEach(ev => {
            const tPfx = ev.time ? esc(ev.time) + ' ' : '';
            html += `<span class="cal-event">${tPfx}${esc(TYPE_ABBREV[ev.type] || 'Evt')}</span>`;
          });
          html += '</td>';
        }
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
  }

  html += '</section>';
  return html;
}

// ── Footer ────────────────────────────────────────────────────────────────
function bulletinFooter(today) {
  const ds = fmt(today, {month:'long', day:'numeric', year:'numeric'});
  return `<footer class="bulletin-footer">Generated ${esc(ds)} &nbsp;&middot;&nbsp; SLV Rotary Calendar Sync</footer>`;
}

// ── Main ──────────────────────────────────────────────────────────────────
function renderNewsletter(allRows) {
  const today  = new Date(); today.setHours(0,0,0,0);
  const cutoff = new Date(today.getTime() + WEEKS_AHEAD * 7 * 86400000);
  const eventCutoff = new Date(today.getTime() + EVENT_WEEKS_AHEAD * 7 * 86400000);
  const meetingCutoff = new Date(today.getTime() + MEETING_WEEKS_AHEAD * 7 * 86400000);

  const detailRows = [], eventRows = [], skimRows = [], recentRows = [];
  const importantItems = [], messageRows = [];

  allRows.forEach(row => {
    const d = parseRowDate(row);
    if (!d) return;
    const dateOnly  = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const cancelled = isCancelled(row);
    const type      = fv(row, COL.eventType).toLowerCase() || 'meeting';
    const important = isImportant(row);

    // Messages are dateless announcements: their date is a "show until" date.
    // They live only in the Important / Announcements sections.
    if (isMessageType(row)) {
      if (dateOnly >= today && !cancelled) {
        (important ? importantItems : messageRows).push(row);
      }
      return;
    }

    const isDetail  = DETAIL_TYPES.includes(type);
    if (dateOnly >= today) {
      // Meetings within the next 3 weeks always appear — even if the speaker is
      // still TBD or the meeting has been cancelled.
      if (dateOnly <= meetingCutoff && isDetail) {
        detailRows.push(row);
      }
      if (dateOnly <= cutoff) {
        skimRows.push(row);
      }
      if (dateOnly <= eventCutoff && !cancelled && HAPPENING_TYPES.includes(type)) {
        eventRows.push(row);
      }
      // Important events are ALSO featured at the top, in addition to keeping
      // their normal spot in Coming Up / Club Events / Looking Ahead.
      if (important && !cancelled && dateOnly <= eventCutoff) {
        importantItems.push(row);
      }
    } else if (type === 'meeting') {
      recentRows.push(row);
    }
  });

  detailRows.sort((a,b) => parseRowDate(a) - parseRowDate(b));
  eventRows.sort((a,b)  => parseRowDate(a) - parseRowDate(b));
  skimRows.sort((a,b)   => parseRowDate(a) - parseRowDate(b));
  recentRows.sort((a,b) => parseRowDate(b) - parseRowDate(a));
  importantItems.sort((a,b) => parseRowDate(a) - parseRowDate(b));
  messageRows.sort((a,b)    => parseRowDate(a) - parseRowDate(b));

  const parts = [masthead(today)];
  if (sectionOn('important') && importantItems.length) parts.push(importantSection(importantItems));
  if (sectionOn('coming-up') && detailRows.length) parts.push(comingUp(detailRows));
  if (sectionOn('club-events') && eventRows.length)  parts.push(clubEvents(eventRows));
  if (sectionOn('looking-ahead') && skimRows.length)   parts.push(lookingAhead(skimRows));
  if (sectionOn('announcements') && messageRows.length) parts.push(announcements(messageRows));
  if (sectionOn('recent') && recentRows.length) parts.push(recentMeetings(recentRows.slice(0, 2)));
  if (sectionOn('calendar')) parts.push(calendarGrid(allRows, today));
  parts.push(bulletinFooter(today));

  const el = document.getElementById('bulletin');
  el.innerHTML = parts.join('\n');
  document.getElementById('bulletin-loading').style.display = 'none';
  el.style.display = 'block';
}

// ── Section chooser ───────────────────────────────────────────────────────
// A viewer preference (per browser) for which sections to show. Looking Ahead
// and Recent Meetings are off by default; the choice persists in localStorage.
const SECTIONS = [
  { key: 'important',     label: 'Important' },
  { key: 'coming-up',     label: 'Meetings Coming Up' },
  { key: 'club-events',   label: 'Club Events & Socials' },
  { key: 'looking-ahead', label: 'Looking Ahead' },
  { key: 'announcements', label: 'Announcements' },
  { key: 'recent',        label: 'Recent Meetings' },
  { key: 'calendar',      label: 'Calendar' },
];
const SECTION_DEFAULT_HIDDEN = ['looking-ahead', 'recent'];
const SECTION_KEY = 'newsletterHiddenSections';

let hiddenSections = (function () {
  try {
    const v = JSON.parse(localStorage.getItem(SECTION_KEY) || 'null');
    if (Array.isArray(v)) return v;
  } catch (e) {}
  return SECTION_DEFAULT_HIDDEN.slice();
})();
let allRowsCache = null;

const sectionOn = key => hiddenSections.indexOf(key) === -1;
function saveHiddenSections() {
  try { localStorage.setItem(SECTION_KEY, JSON.stringify(hiddenSections)); } catch (e) {}
}
function toggleSection(key) {
  const i = hiddenSections.indexOf(key);
  if (i === -1) hiddenSections.push(key); else hiddenSections.splice(i, 1);
  saveHiddenSections();
  if (allRowsCache) renderNewsletter(allRowsCache);
}
function buildSectionMenu() {
  const list = document.getElementById('sec-menu-list');
  list.innerHTML = SECTIONS.map(s =>
    `<label><input type="checkbox" data-key="${s.key}"${sectionOn(s.key) ? ' checked' : ''}> ${esc(s.label)}</label>`
  ).join('');
  list.querySelectorAll('input[data-key]').forEach(cb => {
    cb.addEventListener('change', () => toggleSection(cb.getAttribute('data-key')));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  fetch(CSV_URL)
    .then(r => r.text())
    .then(text => {
      allRowsCache = parseCSV(text).slice(1)
        .filter(r => r.length > COL.time)
        .filter(r => !isHiddenFromNewsletter(r));
      buildSectionMenu();
      document.getElementById('section-controls').style.display = 'block';
      renderNewsletter(allRowsCache);
    })
    .catch(() => {
      document.getElementById('bulletin-loading').textContent =
        'Could not load newsletter data. Make sure the sheet is published to the web.';
    });
});
</script>
