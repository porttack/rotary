<style>
  #year-wrap { max-width: 860px; margin: 0 auto; }

  .year-legend {
    display: flex; flex-wrap: wrap; gap: 0.4em 1.2em;
    margin-bottom: 1.2em;
    font-size: 0.78em; font-family: Arial, sans-serif; color: #444;
  }
  .leg-item { display: flex; align-items: center; gap: 0.35em; }
  .leg-swatch {
    width: 11px; height: 11px; border-radius: 2px;
    display: inline-block; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1);
  }
  .leg-swatch-split {
    width: 11px; height: 11px; border-radius: 2px;
    display: inline-block; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1);
    background: linear-gradient(135deg, #c7d8f7 50%, #93c5fd 50%);
  }

  .year-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 2.8em;
  }
  @media (max-width: 560px) {
    .year-columns { grid-template-columns: 1fr; }
  }
  .year-col { display: flex; flex-direction: column; gap: 1em; }

  .month-title {
    font-family: Arial, sans-serif; font-weight: bold;
    font-size: 0.82em; color: #17458F;
    margin-bottom: 0.2em; letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .month-cal {
    width: 100%; border-collapse: collapse;
    font-family: Arial, sans-serif; font-size: 0.72em;
    table-layout: fixed;
  }
  .month-cal th {
    text-align: center; padding: 1px 0;
    color: #888; font-weight: bold; font-size: 0.82em;
  }
  .month-cal td {
    text-align: center; padding: 2px 1px; line-height: 1.55;
    border-radius: 2px;
  }
  .month-cal td:empty { background: none; }
  .month-cal td.ev-cancelled { background: #e5e7eb; color: #aaa; }
  .month-cal td.today { outline: 2px solid #dc2626; outline-offset: -1px; font-weight: bold; }

  #year-tip {
    display: none; position: fixed; z-index: 9999;
    background: #fff; border: 1px solid #c5cae9; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    padding: 0.55em 0.85em; max-width: 260px; min-width: 130px;
    font-family: Arial, sans-serif; font-size: 0.8em; line-height: 1.5;
    pointer-events: none; color: #222;
  }
  #year-tip .tip-time    { font-weight: bold; color: #17458F; }
  #year-tip .tip-type    { font-style: italic; color: #444; }
  #year-tip .tip-field   { margin-top: 0.15em; }
  #year-tip .tip-summary { color: #555; margin-top: 0.3em; font-size: 0.95em; }
  #year-tip hr           { border: none; border-top: 1px solid #e0e0e0; margin: 0.4em 0; }
</style>

<div style="text-align:right;font-size:0.78em;font-family:Arial,sans-serif;color:#888;margin-bottom:0.4em">
  <span id="year-load-time"></span>
  <button onclick="loadYear()" style="margin-left:0.7em;font-size:0.9em;padding:2px 9px;border:1px solid #ccc;border-radius:3px;background:#f5f5f5;cursor:pointer">↻ Reload</button>
</div>
<div id="year-loading" style="text-align:center;padding:2em;color:#666;">Loading&hellip;</div>
<div id="year-wrap" style="display:none">

  <div class="year-legend">
    <span class="leg-item"><span class="leg-swatch" style="background:#93c5fd"></span>Board Meeting</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#c7d8f7"></span>Meeting</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#a5f3fc"></span>Assembly</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fde68a"></span>Social / Fellowship</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fdba74"></span>Service Project</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fde8d0"></span>Grey Bears</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#e9d5ff"></span>Fundraiser</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#86efac"></span>District Event</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fca5a5"></span>Holiday</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fce7f3; border:1px solid #ccc"></span>Committee</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#d1d5db"></span>Other</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#e5e7eb"></span>Cancelled</span>
    <span class="leg-item"><span class="leg-swatch-split"></span>Two events</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#e2e8f0; box-shadow:inset 0 2px 0 rgba(0,0,0,0.35)"></span>Morning</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#e2e8f0; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.35)"></span>Evening</span>
    <span class="leg-item"><span class="leg-swatch" style="outline:2px solid #dc2626; outline-offset:-1px; font-weight:bold"></span>Today</span>
  </div>

  <!-- June special row: visible only when current month is June -->
  <div class="year-columns" id="june-row" style="display:none">
    <div class="year-col" id="col-june"></div>
    <div class="year-col"></div>
  </div>
  <hr id="june-divider" style="display:none; border:none; border-top:1px solid #e0e0e0; margin:0.2em 0 1em;">

  <div class="year-columns">
    <div class="year-col" id="col-left"></div>
    <div class="year-col" id="col-right"></div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSiIWI11d3jQFL8I7g5vosHef2w-v5nad_hPvrSmlt13_oTar0YXcCXJpV7ZjxCJjguIAXZ7tUB8eXO/pub?gid=1793625237&single=true&output=csv';

const COL = { eventType: 1, cancelled: 2, date: 4, time: 5, location: 7, openingSpeaker: 10, mainSpeaker: 11, mainTopic: 12, summary: 14 };

// Map raw event type string → canonical key
function canonicalType(raw) {
  const t = (raw || '').toLowerCase().trim();
  if (t.includes('board'))                                      return 'board';
  if (t.includes('district') || t.includes('conference') ||
      t.includes('convention') || t.includes('institute'))     return 'district';
  if (t.includes('fundrais') || t.includes('fund-rais') ||
      t.includes('gala') || t.includes('auction'))             return 'fundraiser';
  if (t.includes('grey bears') || t.includes('gray bears'))    return 'greybears';
  if (t.includes('service') || t.includes('project') ||
      t.includes('volunteer'))                                  return 'service';
  if (t.includes('social') || t.includes('fellowship') ||
      t.includes('party') || t.includes('picnic') ||
      t.includes('celebration') || t.includes('banquet'))      return 'social';
  if (t.includes('holiday'))                                    return 'holiday';
  if (t.includes('committee'))                                  return 'committee';
  if (t.includes('assembly'))                                   return 'assembly';
  if (t.includes('meeting') || t.includes('breakfast') ||
      t.includes('lunch') || t.includes('dinner') ||
      t.length === 0)                                           return 'meeting';
  return 'other';
}

const TYPE_COLOR = {
  meeting:    '#c7d8f7',
  assembly:   '#a5f3fc',
  board:      '#93c5fd',
  social:     '#fde68a',
  service:    '#fdba74',
  greybears:  '#fde8d0',
  fundraiser: '#e9d5ff',
  district:   '#86efac',
  committee:  '#fce7f3',
  holiday:    '#fca5a5',
  other:      '#d1d5db',
};

// Lower number = shown first (top-left triangle on split days)
const TYPE_PRIORITY = {
  district:   0,
  fundraiser: 1,
  holiday:    2,
  service:    3,
  greybears:  4,
  social:     4,
  board:      5,
  committee:  6,
  meeting:    7,
  assembly:   8,
  other:      9,
};

function parseCSV(text) {
  const rows = [];
  let cur = [], field = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') { inQuote = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQuote = true; }
      else if (ch === ',') { cur.push(field); field = ''; }
      else if (ch === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
      else if (ch !== '\r') { field += ch; }
    }
  }
  if (field || cur.length) { cur.push(field); rows.push(cur); }
  return rows;
}

function fv(row, idx) { return (row[idx] || '').trim(); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Parse time string → hour 0-23, or null if unparseable.
// Handles "H:MM AM/PM", "H:MM:SS AM/PM" (Google Sheets may include seconds),
// and bare 24-hour "H:MM" / "H:MM:SS".
function timeHour(raw) {
  const s = (raw || '').trim();
  const m12 = s.match(/^(\d{1,2}):\d{2}(?::\d{2})?\s*(AM|PM)$/i);
  if (m12) {
    let h = parseInt(m12[1]);
    const ampm = m12[2].toUpperCase();
    if (ampm === 'PM' && h !== 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    return h;
  }
  const m24 = s.match(/^(\d{1,2}):\d{2}(?::\d{2})?$/);
  if (m24) return parseInt(m24[1]);
  return null;
}

// Returns inline box-shadow CSS for a cell based on time-of-day.
// Uses inset box-shadow instead of border so border-collapse: collapse
// can't suppress it (collapsed borders obey document-order priority,
// so the cell above always wins on a tie — box-shadow bypasses that entirely).
function borderStyle(tod) {
  const c = 'rgba(0,0,0,0.3)';
  const top = `inset 0 2px 0 ${c}`;
  const bot = `inset 0 -2px 0 ${c}`;
  if (tod === 'am')   return `box-shadow:${top};`;
  if (tod === 'pm')   return `box-shadow:${bot};`;
  if (tod === 'both') return `box-shadow:${top},${bot};`;
  return '';
}

function loadYear() {
  ['col-left', 'col-right', 'col-june'].forEach(function(id) {
    document.getElementById(id).innerHTML = '';
  });
  document.getElementById('year-loading').style.display  = 'block';
  document.getElementById('year-loading').textContent    = 'Loading…';
  document.getElementById('year-wrap').style.display     = 'none';
  document.getElementById('june-row').style.display      = 'none';
  document.getElementById('june-divider').style.display  = 'none';

  fetch(CSV_URL + '&t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const rows = parseCSV(text).slice(1).filter(r => r.length > COL.date);

      // Collect events by date
      const evsByDate = {};
      rows.forEach(row => {
        const iso = fv(row, COL.date);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
        const type      = canonicalType(fv(row, COL.eventType));
        const cancelled = fv(row, COL.cancelled).toUpperCase() === 'TRUE';
        const hour      = timeHour(fv(row, COL.time));
        if (!evsByDate[iso]) evsByDate[iso] = [];
        evsByDate[iso].push({
          type,
          rawType:        fv(row, COL.eventType),
          cancelled,
          hour,
          timeStr:        fv(row, COL.time),
          location:       fv(row, COL.location),
          openingSpeaker: fv(row, COL.openingSpeaker),
          mainSpeaker:    fv(row, COL.mainSpeaker),
          mainTopic:      fv(row, COL.mainTopic),
          summary:        fv(row, COL.summary),
        });
      });

      // For each date, produce up to 2 distinct active types (sorted by priority),
      // or 'cancelled' if all events on that day are cancelled.
      // Cancelled events are always included in details for the tooltip.
      const dayInfo = {};
      Object.entries(evsByDate).forEach(([iso, evs]) => {
        const active    = evs.filter(e => !e.cancelled);
        const cancelled = evs.filter(e =>  e.cancelled);

        function makeDet(e, isCancelled) {
          return {
            timeStr:        e.timeStr,
            rawType:        e.rawType,
            openingSpeaker: e.openingSpeaker,
            speaker:        e.mainSpeaker,
            topic:          e.mainTopic,
            location:       e.location,
            summary:        e.summary,
            isCancelled,
          };
        }
        function byTime(arr) {
          return [...arr].sort((a, b) => (a.hour ?? 99) - (b.hour ?? 99));
        }

        if (active.length === 0) {
          dayInfo[iso] = {
            types: [], allCancelled: true,
            details: byTime(cancelled).map(e => makeDet(e, true)),
          };
          return;
        }
        const seen = new Set();
        const sorted = active
          .sort((a, b) => (TYPE_PRIORITY[a.type] ?? 99) - (TYPE_PRIORITY[b.type] ?? 99));
        const types = [];
        for (const e of sorted) {
          if (!seen.has(e.type)) { seen.add(e.type); types.push(e.type); }
          if (types.length === 2) break;
        }
        const hours = active.map(e => e.hour).filter(h => h !== null);
        let timeOfDay = null;
        if (hours.length) {
          const hasAM = hours.some(h => h < 12);
          const hasPM = hours.some(h => h >= 12);
          timeOfDay = (hasAM && hasPM) ? 'both' : hasAM ? 'am' : 'pm';
        }
        // Active events first (time-sorted), cancelled appended at end
        const details = [
          ...byTime(active).map(e => makeDet(e, false)),
          ...byTime(cancelled).map(e => makeDet(e, true)),
        ];
        dayInfo[iso] = { types, allCancelled: false, timeOfDay, details };
      });

      window._yearTipData = dayInfo;

      if (!Object.keys(dayInfo).length) {
        document.getElementById('year-loading').textContent = 'No events found.';
        return;
      }

      const DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

      function buildMonthHtml(ms) {
        const yr       = ms.getFullYear();
        const moIdx    = ms.getMonth();
        const daysInMo = new Date(yr, moIdx + 1, 0).getDate();
        const moLabel  = ms.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        let html = `<div class="month-block">
<div class="month-title">${esc(moLabel)}</div>
<table class="month-cal" role="presentation">
<thead><tr>${DOW.map(d => `<th>${d}</th>`).join('')}</tr></thead>
<tbody>`;

        let dayNum = 1 - ms.getDay();
        while (dayNum <= daysInMo) {
          html += '<tr>';
          for (let dow = 0; dow < 7; dow++, dayNum++) {
            if (dayNum < 1 || dayNum > daysInMo) {
              html += '<td></td>';
            } else {
              const key      = `${yr}-${String(moIdx + 1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
              const info     = dayInfo[key];
              const tCls     = key === todayKey ? ' today' : '';
              if (!info) {
                html += `<td${tCls ? ' class="today"' : ''}>${dayNum}</td>`;
              } else if (info.allCancelled) {
                html += `<td class="ev-cancelled${tCls}" data-date="${key}">${dayNum}</td>`;
              } else if (info.types.length === 1) {
                const bg  = TYPE_COLOR[info.types[0]] || '#f3f4f6';
                const bdr = borderStyle(info.timeOfDay);
                html += `<td data-date="${key}"${tCls ? ' class="today"' : ''} style="background:${bg};${bdr}">${dayNum}</td>`;
              } else {
                const c1   = TYPE_COLOR[info.types[0]] || '#f3f4f6';
                const c2   = TYPE_COLOR[info.types[1]] || '#f3f4f6';
                const grad = `linear-gradient(135deg,${c1} 50%,${c2} 50%)`;
                const bdr  = borderStyle(info.timeOfDay);
                html += `<td data-date="${key}"${tCls ? ' class="today"' : ''} style="background:${grad};${bdr}">${dayNum}</td>`;
              }
            }
          }
          html += '</tr>';
        }
        return html + '</tbody></table></div>';
      }

      // Rotary year runs July–June; same logic as school year
      const now       = new Date();
      const todayKey  = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const startYear = now.getMonth() <= 4 ? now.getFullYear() - 1 : now.getFullYear();

      // If it's currently June, show it above the main grid as a transition month
      if (now.getMonth() === 5) {
        document.getElementById('col-june').insertAdjacentHTML('beforeend',
          buildMonthHtml(new Date(now.getFullYear(), 5, 1)));
        document.getElementById('june-row').style.display     = '';
        document.getElementById('june-divider').style.display = '';
      }

      const leftCol  = document.getElementById('col-left');
      const rightCol = document.getElementById('col-right');
      for (let mo = 0; mo < 12; mo++) {
        const ms = new Date(startYear, 6 + mo, 1); // July = month 6
        (mo < 6 ? leftCol : rightCol).insertAdjacentHTML('beforeend', buildMonthHtml(ms));
      }

      document.getElementById('year-loading').style.display = 'none';
      document.getElementById('year-wrap').style.display    = 'block';
      const t = new Date();
      document.getElementById('year-load-time').textContent =
        'Loaded ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    })
    .catch(() => {
      document.getElementById('year-loading').textContent =
        'Could not load calendar data.';
    });
}

document.addEventListener('DOMContentLoaded', loadYear);

// ── Hover / tap tooltip ────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
  const tip = document.createElement('div');
  tip.id = 'year-tip';
  document.body.appendChild(tip);

  function tipHtml(details) {
    return details.map(function (ev, i) {
      let h = (i > 0 ? '<hr>' : '');
      if (ev.isCancelled) {
        h += '<div style="color:#b91c1c;font-size:0.82em;font-weight:bold;margin-bottom:0.15em">❌ CANCELLED</div>';
        h += '<div style="opacity:0.55">';
      }
      if (ev.timeStr)        h += '<div class="tip-time">'    + esc(ev.timeStr)        + '</div>';
      if (ev.rawType)        h += '<div class="tip-type">'    + esc(ev.rawType)        + '</div>';
      if (ev.openingSpeaker) h += '<div class="tip-field">🎙️ ' + esc(ev.openingSpeaker) + '</div>';
      if (ev.speaker)        h += '<div class="tip-field">🎤 ' + esc(ev.speaker)        + '</div>';
      if (ev.topic)          h += '<div class="tip-field">📋 ' + esc(ev.topic)          + '</div>';
      if (ev.location)       h += '<div class="tip-field">📍 ' + esc(ev.location)       + '</div>';
      if (ev.summary) {
        const s = ev.summary.length > 220 ? ev.summary.slice(0, 220) + '…' : ev.summary;
        h += '<div class="tip-summary">' + esc(s) + '</div>';
      }
      if (ev.isCancelled) h += '</div>';
      return h;
    }).join('');
  }

  // Position near cursor (desktop hover)
  function placeAtCursor(e) {
    const pad = 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const vw = window.innerWidth,  vh = window.innerHeight;
    tip.style.left = (e.clientX + pad + tw < vw)
      ? (e.clientX + pad) + 'px'
      : Math.max(4, e.clientX - pad - tw) + 'px';
    tip.style.top  = (e.clientY + pad + th < vh)
      ? (e.clientY + pad) + 'px'
      : Math.max(4, e.clientY - pad - th) + 'px';
  }

  // Position below (or above) a cell element (mobile tap)
  function placeNearEl(el) {
    const r   = el.getBoundingClientRect();
    const tw  = tip.offsetWidth, th = tip.offsetHeight;
    const vw  = window.innerWidth, vh = window.innerHeight;
    const pad = 8;
    let top  = r.bottom + pad;
    if (top + th > vh - 4) top = Math.max(4, r.top - th - pad);
    let left = r.left + r.width / 2 - tw / 2;
    left = Math.max(4, Math.min(vw - tw - 4, left));
    tip.style.top  = top  + 'px';
    tip.style.left = left + 'px';
  }

  function showForCell(td) {
    const info = window._yearTipData && window._yearTipData[td.dataset.date];
    if (!info || !info.details || !info.details.length) return false;
    tip.innerHTML = tipHtml(info.details);
    tip.style.display = 'block';
    return true;
  }

  // pinned = cell locked open by tap/click; hover is suppressed while pinned
  let cur = null, pinned = null;

  // ── Desktop hover ────────────────────────────────────────────
  document.addEventListener('mouseover', function (e) {
    if (pinned) return;
    const td = e.target.closest && e.target.closest('td[data-date]');
    if (!td || td === cur) return;
    cur = td;
    if (showForCell(td)) placeAtCursor(e);
    else tip.style.display = 'none';
  });

  document.addEventListener('mousemove', function (e) {
    if (pinned || tip.style.display === 'none') return;
    placeAtCursor(e);
  });

  document.addEventListener('mouseout', function (e) {
    if (pinned) return;
    if (e.target === cur) { tip.style.display = 'none'; cur = null; }
  });

  // ── Tap / click — works on both mobile and desktop ───────────
  document.addEventListener('click', function (e) {
    const td = e.target.closest && e.target.closest('td[data-date]');
    if (td) {
      if (td === pinned) {
        // Second tap on same cell → dismiss
        tip.style.display = 'none';
        pinned = null;
      } else {
        if (showForCell(td)) { pinned = td; cur = null; placeNearEl(td); }
      }
      e.stopPropagation();
    } else if (pinned) {
      tip.style.display = 'none';
      pinned = null;
    }
  });
});
</script>
